[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karakana-engine"
version = "0.2.0"
description = "High-performance PyTorch Reinforcement Learning framework with Structural Geometry Optimization (SGO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Karakana Contributors" }
]
keywords = ["reinforcement-learning", "pytorch", "sgo", "ppo", "grpo", "gymnasium", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "gymnasium>=0.28.1",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
box2d = [
    "gymnasium[box2d]",
]
mujoco = [
    "gymnasium[mujoco]",
]
atari = [
    "gymnasium[atari]",
    "ale-py>=0.8.1",
    "opencv-python",
]
sb3 = [
    "stable-baselines3>=2.0.0",
]
all = [
    "gymnasium[box2d]",
    "gymnasium[mujoco]",
    "gymnasium[atari]",
    "ale-py>=0.8.1",
    "opencv-python",
    "stable-baselines3>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["karakana_engine*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
